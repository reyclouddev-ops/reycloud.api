<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReyCloudSHP API</title>
<link rel="icon" type="image/jpeg" href="https://files.catbox.moe/e5x49o.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

:root{
    --bg: #050505;
    --border: rgba(255, 255, 255, 0.12);
    --blue-main: #3b82f6;
    --blue-light: #93c5fd;
    --text: #ffffff;
    --muted: #a1a1aa;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family:Inter,sans-serif; }

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 0 0, rgba(59,130,246, 0.12), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(56,189,248, 0.08), transparent 40%),
        var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Splash Screen / Loading Progress */
.splash-screen{
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 20px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

.splash-screen.fade-out{
    opacity: 0;
    visibility: hidden;
}

.splash-avatar{
    width: 125px;
    height: 125px;
    border-radius: 30px;
    object-fit: cover;
    border: 2px solid var(--border);
    box-shadow: 0 0 40px rgba(59,130,246,0.35);
    animation: bounce 1.5s infinite alternate;
}

@keyframes bounce{
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
}

.splash-title{
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.progress-container{
    width: 240px;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
}

.progress-bar{
    height: 100%;
    width: 0%;
    background: var(--blue-main);
    border-radius: 10px;
    transition: width 0.1s linear;
}

.progress-text{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
}

/* Main Content (Welcome) */
.main-content{
    text-align: center;
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    padding: 20px;
}

.main-content.show{
    opacity: 1;
    transform: translateY(0);
}

.welcome-avatar-wrap{
    margin-bottom: 24px;
}

.welcome-avatar{
    width: 155px;
    height: 155px;
    border-radius: 38px;
    object-fit: cover;
    border: 3px solid var(--border);
    box-shadow: 0 20px 45px rgba(0,0,0,0.8);
}

.welcome-badge{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 30px;
    font-size: 10px;
    font-weight: 800;
    background: rgba(59, 130, 246, 0.1);
    color: var(--blue-light);
    border: 1px solid rgba(59, 130, 246, 0.25);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.welcome-title{
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 10px;
}

.welcome-title span{
    color: var(--blue-main);
}

.welcome-desc{
    color: var(--muted);
    font-size: 13px;
    max-width: 420px;
    margin: 0 auto 25px;
    line-height: 1.6;
}

.enter-btn{
    display: inline-block;
    padding: 12px 28px;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #000;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: .2s;
    box-shadow: 0 10px 25px rgba(255,255,255,0.15);
}

.enter-btn:hover{
    background: var(--blue-light);
    transform: translateY(-2px);
}
</style>
</head>

<body>

<!-- Splash Screen & Loading Progress -->
<div class="splash-screen" id="splashScreen">
    <img src="https://files.catbox.moe/e5x49o.png" alt="Logo" class="splash-avatar">
    <div class="splash-title">ReyCloud API</div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="progress-text" id="progressText">Loading resources... 0%</div>
</div>

<!-- Welcome Content -->
<div class="main-content" id="mainContent">
    <div class="welcome-avatar-wrap">
        <img src="https://files.catbox.moe/e5x49o.png" alt="Logo" class="welcome-avatar">
    </div>
    <div class="welcome-badge">Secure & Fast Gateway</div>
    <h1 class="welcome-title">Welcome to <span>ReyCloudSHP Api</span></h1>
    <p class="welcome-desc">
        Platform API digital terintegrasi untuk berbagai kebutuhan tools, artificial intelligence, downloader, dan scraper berkecepatan tinggi.
    </p>
    <a href="/dashboard" class="enter-btn">Gass Polll 🚀</a>
</div>

<script>
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const splashScreen = document.getElementById("splashScreen");
const mainContent = document.getElementById("mainContent");

let progress = 0;

const loadingInterval = setInterval(() => {
    progress += Math.floor(Math.random() * 8) + 3;
    if(progress >= 100){
        progress = 100;
        clearInterval(loadingInterval);
        
        setTimeout(() => {
            splashScreen.classList.add("fade-out");
            mainContent.classList.add("show");
        }, 300);
    }
    
    progressBar.style.width = progress + "%";
    progressText.textContent = `Loading resources... ${progress}%`;
}, 60);
</script>

</body>
</html>
